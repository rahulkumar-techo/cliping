services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: clipcraft-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 7G
        reservations:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional Nginx Reverse Proxy (run with: docker compose --profile proxy up -d)
  nginx:
    image: nginx:alpine
    container_name: clipcraft-nginx
    restart: unless-stopped
    profiles:
      - proxy
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
